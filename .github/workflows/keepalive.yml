name: keepalive

# Neon suspends its compute after a few idle minutes. A call every 6 h keeps the demo warm.
# GitHub disables scheduled workflows after 60 days without repository activity; this one
# can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        run: >-
          curl -fsS --max-time 30 --retry 3 --retry-delay 10
          https://miners-fullstack-challenge.vercel.app/api/health
