name: keepalive

# Neon apaga el compute tras unos minutos sin consultas y tarda ~0,5 s en despertar. Una
# visita cada 6 h mantiene la demo caliente para quien la abra sin avisar.
#
# GitHub deshabilita los `schedule` tras 60 días sin actividad en el repositorio; también
# se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        run: >-
          curl -fsS --max-time 30 --retry 3 --retry-delay 10
          https://miners-fullstack-challenge.vercel.app/api/health
